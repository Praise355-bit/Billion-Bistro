<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billion Bistro | Wuse 2, Abuja</title>
  <meta name="description" content="Billion Bistro by Chef Billion - Gourmet dining, continental dishes, fast casual bites, and craft drinks in Wuse 2, Abuja. Order online or reserve a table.">
  <meta name="theme-color" content="#121212">
  
  <!-- Manifest (Inlined via Data URI for single-file PWA) -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"Billion Bistro","short_name":"BillionBistro","start_url":".","display":"standalone","background_color":"#121212","theme_color":"#d4af37","icons":[{"src":"https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=192&h=192&fit=crop","sizes":"192x192","type":"image/jpeg"},{"src":"https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=512&h=512&fit=crop","sizes":"512x512","type":"image/jpeg"}]}'>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #121212;
      --bg-card: #1c1c1e;
      --bg-elevated: #26262a;
      --accent-gold: #d4af37;
      --accent-gold-hover: #f3c63f;
      --text-main: #f5f5f7;
      --text-muted: #a1a1a6;
      --border-color: #2c2c2e;
      --whatsapp-green: #25d366;
      --radius-lg: 16px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding-bottom: 80px;
    }

    h1, h2, h3, .brand-font {
      font-family: 'Cinzel', serif;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(18, 18, 18, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent-gold);
      letter-spacing: 1px;
    }

    .cart-btn {
      position: relative;
      background: var(--bg-elevated);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }

    .cart-count {
      background: var(--accent-gold);
      color: #000;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 10px;
    }

    .hero {
      position: relative;
      height: 260px;
      background: linear-gradient(180deg, rgba(18,18,18,0.3) 0%, rgba(18,18,18,1) 100%),
                  url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1200&q=80') center/cover;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 24px 20px;
    }

    .hero h1 {
      font-size: 2rem;
      color: #fff;
      margin-bottom: 4px;
    }

    .hero p {
      color: var(--accent-gold);
      font-size: 0.95rem;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    .info-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: 24px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .info-item span {
      display: block;
      color: var(--text-main);
      font-weight: 600;
      margin-bottom: 2px;
    }

    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 20px;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .cat-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 18px;
      border-radius: 20px;
      white-space: nowrap;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }

    .cat-btn.active, .cat-btn:hover {
      background: var(--accent-gold);
      color: #000;
      border-color: var(--accent-gold);
    }

    .section-title {
      font-size: 1.4rem;
      margin-bottom: 16px;
      color: var(--accent-gold);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .menu-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .menu-card h3 {
      font-size: 1.1rem;
      margin-bottom: 6px;
    }

    .menu-card p {
      color: var(--text-muted);
      font-size: 0.825rem;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
    }

    .price {
      font-weight: 700;
      color: var(--accent-gold);
      font-size: 1rem;
    }

    .add-btn {
      background: var(--bg-elevated);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    .add-btn:hover {
      background: var(--accent-gold);
      color: #000;
    }

    /* Modal / Drawer */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 200;
      display: none;
      justify-content: flex-end;
    }

    .modal-overlay.active {
      display: flex;
    }

    .drawer {
      background: var(--bg-dark);
      width: 100%;
      max-width: 420px;
      height: 100%;
      padding: 24px;
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--border-color);
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-card);
      padding: 12px;
      border-radius: var(--radius-sm);
    }

    .item-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .qty-btn {
      background: var(--bg-elevated);
      border: none;
      color: var(--text-main);
      width: 24px;
      height: 24px;
      border-radius: 4px;
      cursor: pointer;
    }

    .cart-total {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .checkout-btn {
      width: 100%;
      background: var(--whatsapp-green);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: var(--radius-sm);
      font-weight: 700;
      margin-top: 16px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: var(--bg-card);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      padding: 12px 0;
      z-index: 90;
    }

    .nav-item {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--accent-gold);
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-main);
    }

    .btn-gold {
      width: 100%;
      background: var(--accent-gold);
      color: #000;
      border: none;
      padding: 12px;
      border-radius: var(--radius-sm);
      font-weight: 700;
      cursor: pointer;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span class="brand-title">BILLION BISTRO</span>
    </div>
    <div class="header-actions">
      <button class="cart-btn" onclick="toggleCart()">
        Cart <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <div class="hero">
    <h1>Billion Bistro</h1>
    <p>Plot 118 Aminu Kano Crescent, Wuse 2, Abuja</p>
  </div>

  <div class="container">
    <div class="info-card">
      <div class="info-item">
        <span>Location</span>
        Wuse 2, Abuja (Opp. Glo Office)
      </div>
      <div class="info-item">
        <span>Hours</span>
        Mon - Sun: 10:00 AM - 11:00 PM
      </div>
      <div class="info-item">
        <span>Average Pricing</span>
        From ₦5,000 per meal
      </div>
    </div>

    <!-- Main View: Menu -->
    <main id="menuView">
      <div class="categories" id="categoryList"></div>
      <h2 class="section-title" id="currentCategoryTitle">All Items</h2>
      <div class="menu-grid" id="menuGrid"></div>
    </main>

    <!-- Reservation View -->
    <section id="reservationView" class="hidden">
      <h2 class="section-title">Reserve a Table</h2>
      <form id="reservationForm" onsubmit="handleReservation(event)" style="background: var(--bg-card); padding: 20px; border-radius: var(--radius-lg); border: 1px solid var(--border-color);">
        <div class="form-group">
          <label for="resName">Full Name</label>
          <input type="text" id="resName" required placeholder="e.g. Praise Tunde">
        </div>
        <div class="form-group">
          <label for="resPhone">Phone Number</label>
          <input type="tel" id="resPhone" required placeholder="08012345678">
        </div>
        <div class="form-group">
          <label for="resGuests">Number of Guests</label>
          <select id="resGuests">
            <option value="1-2">1 - 2 Guests</option>
            <option value="3-4">3 - 4 Guests</option>
            <option value="5+">5+ Guests (VIP / Group Table)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="resDate">Date</label>
          <input type="date" id="resDate" required>
        </div>
        <div class="form-group">
          <label for="resTime">Time</label>
          <input type="time" id="resTime" required>
        </div>
        <button type="submit" class="btn-gold" style="margin-top: 10px;">Send Reservation Request via WhatsApp</button>
      </form>
    </section>
  </div>

  <!-- Cart Modal -->
  <div class="modal-overlay" id="cartModal">
    <div class="drawer">
      <div class="drawer-header">
        <h3>Your Order</h3>
        <button class="close-btn" onclick="toggleCart()">&times;</button>
      </div>
      <div class="cart-items" id="cartItems"></div>
      <div class="cart-total">
        <span>Total:</span>
        <span id="cartTotalSum">₦0</span>
      </div>
      <button class="checkout-btn" onclick="checkoutWhatsApp()">
        Complete Order on WhatsApp
      </button>
    </div>
  </div>

  <!-- Navigation Bar -->
  <nav class="nav-bar">
    <button class="nav-item active" id="navMenu" onclick="switchView('menu')">
      <span>Menu</span>
    </button>
    <button class="nav-item" id="navRes" onclick="switchView('reservation')">
      <span>Reservations</span>
    </button>
  </nav>

  <script>
    // Configuration: Replace with Billion Bistro's official WhatsApp number (e.g., 2348012345678)
    const RESTAURANT_PHONE = "2348000000000";

    // Detailed Menu Items
    const menuData = [
      { id: 1, name: "Cajun Seafood Pasta", category: "Pastas", price: 13500, desc: "Creamy fettuccine served with juicy jumbo prawns, calamari, and garlic herb butter." },
      { id: 2, name: "Creamy Chicken Alfredo", category: "Pastas", price: 9500, desc: "Classic Alfredo pasta cooked with grilled chicken strips and aged Parmesan cheese." },
      { id: 3, name: "Spaghetti Spicy Arrabbiata", category: "Pastas", price: 7500, desc: "Al dente pasta tossed in rich basil tomato sauce with a chili kick." },
      { id: 4, name: "Grilled Ribeye Steak", category: "Grill", price: 19500, desc: "Prime steak cut grilled to perfection with mushroom sauce and potato wedges." },
      { id: 5, name: "Peppered Turkey & Yam Chips", category: "Grill", price: 10500, desc: "Deep-fried spiced turkey tossed in pepper sauce, served with crisp yam chips." },
      { id: 6, name: "Billion Suya Platter", category: "Grill", price: 12000, desc: "Grilled tender beef suya, chicken suya, roasted onions, and cabbage." },
      { id: 7, name: "Chef Billion Special Burger", category: "Fast Bites", price: 8000, desc: "Double beef patty, crispy bacon, cheddar, house sauce, served with french fries." },
      { id: 8, name: "Signature Asun Roll Wrap", category: "Fast Bites", price: 6500, desc: "Spiced peppered goat meat wrapped in tortilla bread with fresh coleslaw." },
      { id: 9, name: "Crispy Garlic Wings", category: "Fast Bites", price: 7000, desc: "6 pieces of deep-fried chicken wings tossed in garlic honey glaze." },
      { id: 10, name: "Tropical Passion Mocktail", category: "Drinks", price: 4500, desc: "A refreshing blend of passion fruit, fresh lime juice, mint leaves, and soda." },
      { id: 11, name: "Biscoff Milkshake", category: "Drinks", price: 5500, desc: "Rich Lotus Biscoff spread blended with vanilla bean ice cream and whipped cream." },
      { id: 12, name: "Triple Chocolate Sundae", category: "Desserts", price: 4500, desc: "Chocolate brownie fudge topped with vanilla scoops and warm chocolate sauce." }
    ];

    let cart = [];

    function init() {
      renderCategories();
      renderMenu('All');
    }

    function renderCategories() {
      const categories = ['All', ...new Set(menuData.map(i => i.category))];
      const container = document.getElementById('categoryList');
      container.innerHTML = categories.map(cat => `
        <button class="cat-btn ${cat === 'All' ? 'active' : ''}" onclick="filterCategory('${cat}', this)">${cat}</button>
      `).join('');
    }

    function filterCategory(cat, btn) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('currentCategoryTitle').innerText = cat === 'All' ? 'All Items' : cat;
      renderMenu(cat);
    }

    function renderMenu(category) {
      const container = document.getElementById('menuGrid');
      const filtered = category === 'All' ? menuData : menuData.filter(i => i.category === category);
      
      container.innerHTML = filtered.map(item => `
        <div class="menu-card">
          <div>
            <h3>${item.name}</h3>
            <p>${item.desc}</p>
          </div>
          <div class="card-footer">
            <span class="price">₦${item.price.toLocaleString()}</span>
            <button class="add-btn" onclick="addToCart(${item.id})">+ Add</button>
          </div>
        </div>
      `).join('');
    }

    function addToCart(id) {
      const existing = cart.find(i => i.id === id);
      if (existing) {
        existing.qty += 1;
      } else {
        const item = menuData.find(i => i.id === id);
        cart.push({ ...item, qty: 1 });
      }
      updateCartUI();
    }

    function updateQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) {
        cart = cart.filter(i => i.id !== id);
      }
      updateCartUI();
    }

    function updateCartUI() {
      const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
      const totalSum = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      
      document.getElementById('cartCount').innerText = totalCount;
      document.getElementById('cartTotalSum').innerText = `₦${totalSum.toLocaleString()}`;

      const itemsContainer = document.getElementById('cartItems');
      if (cart.length === 0) {
        itemsContainer.innerHTML = '<p style="color: var(--text-muted); text-align: center; margin-top: 40px;">Your cart is empty.</p>';
      } else {
        itemsContainer.innerHTML = cart.map(item => `
          <div class="cart-item">
            <div>
              <div style="font-weight: 600;">${item.name}</div>
              <div style="color: var(--accent-gold); font-size: 0.85rem;">₦${(item.price * item.qty).toLocaleString()}</div>
            </div>
            <div class="item-controls">
              <button class="qty-btn" onclick="updateQty(${item.id}, -1)">-</button>
              <span>${item.qty}</span>
              <button class="qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
            </div>
          </div>
        `).join('');
      }
    }

    function toggleCart() {
      const modal = document.getElementById('cartModal');
      modal.classList.toggle('active');
    }

    function switchView(view) {
      document.getElementById('menuView').classList.toggle('hidden', view !== 'menu');
      document.getElementById('reservationView').classList.toggle('hidden', view !== 'reservation');
      
      document.getElementById('navMenu').classList.toggle('active', view === 'menu');
      document.getElementById('navRes').classList.toggle('active', view === 'reservation');
    }

    function checkoutWhatsApp() {
      if (cart.length === 0) return alert('Your cart is empty');
      
      let message = "Hello Billion Bistro! I would like to place an order:\n\n";
      cart.forEach(item => {
        message += `• ${item.name} x${item.qty} - ₦${(item.price * item.qty).toLocaleString()}\n`;
      });
      const totalSum = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      message += `\n*Total Order Amount:* ₦${totalSum.toLocaleString()}`;
      
      const encoded = encodeURIComponent(message);
      window.open(`https://wa.me/${RESTAURANT_PHONE}?text=${encoded}`, '_blank');
    }

    function handleReservation(e) {
      e.preventDefault();
      const name = document.getElementById('resName').value;
      const phone = document.getElementById('resPhone').value;
      const guests = document.getElementById('resGuests').value;
      const date = document.getElementById('resDate').value;
      const time = document.getElementById('resTime').value;

      const message = `Hello Billion Bistro! I would like to reserve a table:\n\n` +
                      `• *Name:* ${name}\n` +
                      `• *Phone:* ${phone}\n` +
                      `• *Guests:* ${guests}\n` +
                      `• *Date:* ${date}\n` +
                      `• *Time:* ${time}`;

      const encoded = encodeURIComponent(message);
      window.open(`https://wa.me/${RESTAURANT_PHONE}?text=${encoded}`, '_blank');
    }

    // Register Service Worker for PWA Offline Functionality
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
        self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
        self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => new Response('Offline'))));
      `;
      const blob = new Blob([swCode], { type: 'text/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }

    init();
  </script>
</body>
</html>
